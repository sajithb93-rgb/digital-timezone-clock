name: BTCUSDT 5m Backtest

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Git branch or tag containing the backtest code"
        required: true
        default: "feature/elitewave-autodraw"
        type: string
      days:
        description: "Lookback period in days"
        required: true
        default: "90"
        type: string
      initial_equity:
        description: "Starting equity (USDT)"
        required: true
        default: "10000"
        type: string
      risk_fraction:
        description: "Equity risk per trade (0.01 = 1%)"
        required: true
        default: "0.01"
        type: string

permissions:
  contents: read

concurrency:
  group: btcusdt-backtest-launcher
  cancel-in-progress: false

jobs:
  backtest:
    name: Run Binance Futures backtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate code ref
        env:
          CODE_REF: ${{ inputs.code_ref }}
        run: |
          case "$CODE_REF" in
            main|master|trading-analysis-dashboard|feature/elitewave-autodraw) exit 0 ;;
            *) echo "Unsupported code_ref: $CODE_REF"; exit 1 ;;
          esac

      - name: Checkout backtest code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck backtest code
        run: npm run typecheck

      - name: Run BTCUSDT 5m backtest
        env:
          SYMBOL: BTCUSDT
          DAYS: ${{ inputs.days }}
          INITIAL_EQUITY: ${{ inputs.initial_equity }}
          RISK_FRACTION: ${{ inputs.risk_fraction }}
        run: npm run backtest

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-5m-backtest-${{ github.run_number }}
          path: backtest-*.json
          if-no-files-found: warn
          retention-days: 30
