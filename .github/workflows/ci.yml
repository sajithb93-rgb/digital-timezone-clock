name: CI
permissions:
  contents: read
  statuses: write
on:
  push:
    branches: [trading-analysis-dashboard, feature/elitewave-autodraw, feature/smc-signal-engine]
  pull_request:
    branches: [trading-analysis-dashboard]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish typecheck diagnostic
        if: steps.typecheck.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          message=$(grep -E "error TS[0-9]+:" /tmp/typecheck.log | head -n 1 || true)
          if [ -z "${message}" ]; then
            message=$(tail -n 3 /tmp/typecheck.log | tr '\n' ' ' | head -c 130)
          fi
          payload=$(node -e 'const fs=require("fs"); const m=fs.readFileSync("/tmp/typecheck.log","utf8"); const first=(m.match(/error TS[0-9]+:.*/)||[])[0] || m.trim().split("\n").slice(-3).join(" "); const d=first.slice(0,140); console.log(JSON.stringify({state:"failure",context:"Typecheck Diagnostic",description:d,target_url:process.env.GITHUB_SERVER_URL+"/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID}));')
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"

      - name: Enforce typecheck
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1

      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
