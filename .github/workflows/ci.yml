name: CI
on:
  push:
    branches: [trading-analysis-dashboard, feature/elitewave-autodraw, feature/smc-signal-engine]
  pull_request:
    branches: [trading-analysis-dashboard]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
