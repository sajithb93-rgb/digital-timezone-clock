name: CI
permissions:
  contents: read
  statuses: write
on:
  push:
    branches: [trading-analysis-dashboard, feature/elitewave-autodraw, feature/smc-signal-engine]
  pull_request:
    branches: [trading-analysis-dashboard]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish typecheck diagnostic
        if: steps.typecheck.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(node -e 'const fs=require("fs"); const m=fs.readFileSync("/tmp/typecheck.log","utf8"); const first=(m.match(/error TS[0-9]+:.*/)||[])[0] || m.trim().split("\n").slice(-3).join(" "); console.log(JSON.stringify({state:"failure",context:"Typecheck Diagnostic",description:first.slice(0,140),target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID}));')
          curl -fsS -X POST -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "${payload}"

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish test diagnostic
        if: steps.tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(node -e 'const fs=require("fs"); const m=fs.readFileSync("/tmp/test.log","utf8"); const lines=m.split("\n").filter(Boolean); const first=lines.find(x=>/FAIL|AssertionError|Error:|expected/.test(x)) || lines.slice(-5).join(" "); console.log(JSON.stringify({state:"failure",context:"Test Diagnostic",description:first.slice(0,140),target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID}));')
          curl -fsS -X POST -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "${payload}"

      - name: Run npm audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish audit diagnostic
        if: steps.audit.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(node -e 'const fs=require("fs"); const m=fs.readFileSync("/tmp/audit.log","utf8"); const lines=m.split("\n").filter(Boolean); const first=lines.slice(-8).join(" "); console.log(JSON.stringify({state:"failure",context:"Audit Diagnostic",description:first.slice(0,140),target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID}));')
          curl -fsS -X POST -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "${payload}"

      - name: Run production build
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish build diagnostic
        if: steps.production_build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(node -e 'const fs=require("fs"); const m=fs.readFileSync("/tmp/build.log","utf8"); const lines=m.split("\n").filter(Boolean); const hits=lines.filter(x=>/Failed to compile|Error:|Type error:|Expected unicode escape|Module not found|Build failed/.test(x)); const first=hits[0] || lines.slice(-6).join(" "); console.log(JSON.stringify({state:"failure",context:"Build Diagnostic",description:first.slice(0,140),target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID}));')
          curl -fsS -X POST -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "${payload}"

      - name: Enforce CI
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.typecheck.outcome }}" = "failure" ]; then failed=1; fi
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then failed=1; fi
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then failed=1; fi
          if [ "${{ steps.production_build.outcome }}" = "failure" ]; then failed=1; fi
          exit "${failed}"
