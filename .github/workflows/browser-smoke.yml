name: Browser smoke

on:
  push:
    branches:
      - feature/elitewave-autodraw
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/quantstructure-next.log 2>&1 &
          echo $! > /tmp/quantstructure-next.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quantstructure-next.log
          exit 1

      - name: Run browser smoke
        run: node scripts/browser-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            artifacts/browser-smoke.png
            /tmp/quantstructure-next.log
          if-no-files-found: ignore
